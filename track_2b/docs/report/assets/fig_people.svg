<title id="t">Visual impairment in Switzerland and accessible municipal websites</title>
<desc id="d">Left: outline of Switzerland split by area, 80 % grey and 20 % red: about 1.8 million adults, one resident in five, live with a disability. Middle: Klar.'s 26 checks cover barriers for blind people (9 checks), low vision and colour (4), motor and voice input (2) and cognitive disabilities (11). Right: 70 squares for 70 municipal websites tested with a screen reader in 2025: 5 worked without obstacles, 65 had obstacles.</desc>
