<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" role="img" aria-labelledby="f1-title f1-desc" font-family="Inter, 'Inter Variable', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="f1-title">Klar. pipeline and deployment modes</title>
  <desc id="f1-desc">Capture, then facts computed in code by axe-core and 26 check modules; a cascade filters injection-like text, lets code decide clear cases and sends only undecided elements to Apertus as one closed JSON question; an evidence guard keeps grounded answers; findings are reviewed by a person. Inside the organisation perimeter run the app, the local model container and replay mode; the Swiss cloud endpoint is outside the perimeter, and only one element excerpt per question leaves it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#0F1115"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#565B66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="432" fill="#FFFFFF"/>

  <!-- Organisation perimeter (modes a and b) -->
  <rect x="8" y="16" width="884" height="340" rx="14" fill="none" stroke="#D0021B" stroke-width="2"/>
  <rect x="20" y="6" width="404" height="20" fill="#FFFFFF"/>
  <rect x="26" y="11" width="10" height="10" fill="#D0021B"/>
  <text x="42" y="21" font-size="13" font-weight="600" fill="#B00016">Organisation perimeter: on-premise (a) or air-gapped (b)</text>

  <!-- Row 1: rule-based pipeline -->
  <g font-size="12.5" fill="#0F1115">
    <rect x="25" y="40" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="1.25"/>
    <text x="37" y="62" font-size="14.5" font-weight="700">1  Capture</text>
    <text x="37" y="82">URL or HTML</text>
    <text x="37" y="99">Playwright render</text>
    <text x="37" y="116">DOM, names, crops</text>

    <rect x="200" y="40" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="1.25"/>
    <text x="212" y="62" font-size="14.5" font-weight="700">2  Facts</text>
    <text x="212" y="82">axe-core rules</text>
    <text x="212" y="99">26 checks: facts</text>
    <text x="212" y="116">computed in code</text>

    <rect x="375" y="40" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="1.25"/>
    <text x="387" y="62" font-size="14.5" font-weight="700">3  Cascade</text>
    <text x="387" y="82">injection filter</text>
    <text x="387" y="99">clear: code decides</text>
    <text x="387" y="116">unclear: Apertus ↓</text>

    <rect x="550" y="40" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="1.25"/>
    <text x="562" y="62" font-size="14.5" font-weight="700">5  Finding</text>
    <text x="562" y="82">failed, cantTell</text>
    <text x="562" y="99">or passed; cites</text>
    <text x="562" y="116">WCAG, EN 301 549</text>

    <rect x="725" y="40" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="1.25"/>
    <text x="737" y="62" font-size="14.5" font-weight="700">6  Human review</text>
    <text x="737" y="82">accept or reject</text>
    <text x="737" y="99">export HTML, JSON,</text>
    <text x="737" y="116">EARL, CSV</text>
  </g>

  <!-- Row 1 arrows -->
  <g stroke="#0F1115" stroke-width="1.4" fill="none">
    <line x1="176" y1="83" x2="198" y2="83" marker-end="url(#arrow)"/>
    <line x1="351" y1="83" x2="373" y2="83" marker-end="url(#arrow)"/>
    <line x1="526" y1="83" x2="548" y2="83" marker-end="url(#arrow)"/>
    <line x1="701" y1="83" x2="723" y2="83" marker-end="url(#arrow)"/>
  </g>
  <text x="537.5" y="76" font-size="11" fill="#565B66" text-anchor="middle">rule</text>

  <!-- Row 2: Apertus and evidence guard -->
  <rect x="375" y="166" width="150" height="80" rx="10" fill="#0F1115"/>
  <rect x="509" y="174" width="8" height="8" fill="#D0021B"/>
  <g fill="#FFFFFF" font-size="12.5">
    <text x="387" y="188" font-size="14.5" font-weight="700">Apertus</text>
    <text x="387" y="206">one closed question</text>
    <text x="387" y="222">JSON schema, T = 0</text>
    <text x="387" y="238">thinking off</text>
  </g>

  <rect x="550" y="166" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="1.25"/>
  <g fill="#0F1115" font-size="12.5">
    <text x="562" y="188" font-size="14.5" font-weight="700">4  Evidence guard</text>
    <text x="562" y="206">excerpt verbatim?</text>
    <text x="562" y="222">selector resolves?</text>
    <text x="562" y="238">no: cantTell</text>
  </g>

  <g stroke="#0F1115" stroke-width="1.4" fill="none">
    <line x1="450" y1="127" x2="450" y2="164" marker-end="url(#arrow)"/>
    <line x1="526" y1="206" x2="548" y2="206" marker-end="url(#arrow)"/>
    <line x1="625" y1="165" x2="625" y2="128" marker-end="url(#arrow)"/>
  </g>
  <text x="443" y="150" font-size="11.5" fill="#565B66" text-anchor="end">undecided only</text>
  <text x="632" y="150" font-size="11.5" fill="#565B66">grounded</text>

  <!-- Row 3: model endpoint, chosen by LLM_BASE_URL -->
  <text x="25" y="300" font-size="12.5" fill="#565B66">Endpoint chosen by</text>
  <text x="25" y="317" font-size="12.5" fill="#565B66" font-family="'JetBrains Mono', Consolas, monospace">LLM_BASE_URL</text>

  <rect x="200" y="280" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#565B66" stroke-width="1.25" stroke-dasharray="5 3"/>
  <g fill="#0F1115" font-size="12.5">
    <text x="212" y="300" font-size="13.5" font-weight="700">Replay (no URL)</text>
    <text x="212" y="317">recorded answers</text>
    <text x="212" y="332">JSONL, no network</text>
  </g>

  <rect x="375" y="280" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="1.25"/>
  <g fill="#0F1115" font-size="12.5">
    <text x="387" y="300" font-size="13.5" font-weight="700">Model container</text>
    <text x="387" y="317">vLLM, Apertus 8B</text>
    <text x="387" y="332">BF16 on RTX 5090</text>
  </g>

  <g fill="none" stroke-width="1.3">
    <line x1="450" y1="249" x2="450" y2="277" stroke="#0F1115" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M410,247 V262 H275 V277" stroke="#565B66" stroke-dasharray="5 3" marker-end="url(#arrow-muted)"/>
    <path d="M490,247 V262 H760 V367" stroke="#0F1115" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  </g>
  <text x="457" y="271" font-size="11.5" fill="#565B66">a, b</text>
  <text x="300" y="257" font-size="11.5" fill="#565B66">replay</text>
  <text x="767" y="300" font-size="11.5" fill="#565B66">c</text>

  <!-- Outside the perimeter: Swiss cloud -->
  <rect x="440" y="370" width="435" height="54" rx="10" fill="#FAFAF7" stroke="#0F1115" stroke-width="1.25"/>
  <text x="452" y="391" font-size="13.5" font-weight="700" fill="#0F1115">c) Swiss cloud: Phoeniqs, Apertus 70B</text>
  <text x="452" y="411" font-size="12" fill="#0F1115">Only one element excerpt per question leaves the perimeter.</text>

  <!-- Legend -->
  <rect x="25" y="380" width="12" height="12" rx="2" fill="#0F1115"/>
  <text x="44" y="391" font-size="12" fill="#565B66">The only step that calls a model.</text>
  <line x1="25" y1="409" x2="37" y2="409" stroke="#0F1115" stroke-width="1.3" stroke-dasharray="4 2"/>
  <text x="44" y="413" font-size="12" fill="#565B66">Dashed: one endpoint per deployment.</text>
</svg>
