<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 178" role="img" aria-labelledby="t d" font-family="'Ubuntu Sans', Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Two barriers on real Swiss pages that Lighthouse does not report</title>
<desc id="d">Two rows from live scans on 15 October 2026. ebgb.admin.ch scores 100 in Lighthouse, yet a screen reader reads its logo as the template sentence 'Bild mit url des Webauftrittes und Titel der Webseite'; Klar. reports a failure of WCAG 1.1.1, decided by Apertus 8B. biel-bienne.ch scores 88; on a German page the French heading 'Ici c'est Bienne' has no lang attribute, so it is spoken with German pronunciation; Klar. reports a failure of WCAG 3.1.2, decided by Apertus 8B.</desc>
<rect width="780" height="178" fill="#FFFFFF"/>
<circle cx="32" cy="42" r="23" fill="none" stroke="#E4E2DC" stroke-width="5"/><circle cx="32" cy="42" r="23" fill="none" stroke="#1E6B45" stroke-width="5" stroke-linecap="round" stroke-dasharray="144.5 144.5" transform="rotate(-90 32 42)"/><text x="32.0" y="48.0" font-size="17" font-weight="800" fill="#1E6B45" text-anchor="middle">100</text>
<text x="70.0" y="30.0" font-size="15" font-weight="700" fill="#0F1115" text-anchor="start">ebgb.admin.ch</text>
<text x="70.0" y="48.0" font-size="12" font-weight="400" fill="#565B66" text-anchor="start">Federal disability equality office</text>
<text x="70.0" y="64.0" font-size="12" font-weight="400" fill="#565B66" text-anchor="start">Lighthouse accessibility: 100 / 100</text>
<rect x="300" y="8" width="276" height="70" rx="8" fill="#F3F3F1"/><text x="314.0" y="28.0" font-size="11.5" font-weight="400" fill="#565B66" text-anchor="start">A screen reader reads the logo as:</text>
<text x="314.0" y="47.0" font-size="13" font-weight="700" fill="#0F1115" text-anchor="start">«Bild mit url des Webauftrittes</text>
<text x="314.0" y="64.0" font-size="13" font-weight="700" fill="#0F1115" text-anchor="start">und Titel der Webseite»</text>
<rect x="594" y="22" width="186" height="24" rx="12" fill="#D0021B"/><text x="687.0" y="38.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Failed · WCAG 1.1.1</text>
<text x="687.0" y="64.0" font-size="12" font-weight="600" fill="#D0021B" text-anchor="middle">decided by Apertus 8B</text>

<line x1="0" y1="89" x2="780" y2="89" stroke="#E4E2DC" stroke-width="1"/>
<circle cx="32" cy="134" r="23" fill="none" stroke="#E4E2DC" stroke-width="5"/><circle cx="32" cy="134" r="23" fill="none" stroke="#B45F06" stroke-width="5" stroke-linecap="round" stroke-dasharray="127.2 144.5" transform="rotate(-90 32 134)"/><text x="32.0" y="140.0" font-size="17" font-weight="800" fill="#B45F06" text-anchor="middle">88</text>
<text x="70.0" y="122.0" font-size="15" font-weight="700" fill="#0F1115" text-anchor="start">biel-bienne.ch</text>
<text x="70.0" y="140.0" font-size="12" font-weight="400" fill="#565B66" text-anchor="start">Bilingual city, German page</text>
<text x="70.0" y="156.0" font-size="12" font-weight="400" fill="#565B66" text-anchor="start">Lighthouse accessibility: 88 / 100</text>
<rect x="300" y="100" width="276" height="70" rx="8" fill="#F3F3F1"/><text x="314.0" y="120.0" font-size="11.5" font-weight="400" fill="#565B66" text-anchor="start">French heading without lang="fr":</text>
<text x="314.0" y="139.0" font-size="13" font-weight="700" fill="#0F1115" text-anchor="start">«Ici c’est Bienne»</text>
<text x="314.0" y="156.0" font-size="11.5" font-weight="400" fill="#565B66" text-anchor="start" font-style="italic">spoken with German pronunciation</text>
<rect x="594" y="114" width="186" height="24" rx="12" fill="#D0021B"/><text x="687.0" y="130.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Failed · WCAG 3.1.2</text>
<text x="687.0" y="156.0" font-size="12" font-weight="600" fill="#D0021B" text-anchor="middle">decided by Apertus 8B</text>

</svg>
