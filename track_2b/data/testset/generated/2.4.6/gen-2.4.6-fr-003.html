<main>
<h1>Demande de réduction des primes</h1>
<p>Les personnes à revenu modeste peuvent demander une réduction de leur prime d'assurance-maladie.</p>
<form action="reduction-envoyee.html" method="post">
<label for="nom-av">Nom et prénom</label>
<input id="nom-av" name="nom-av" type="text">
<label for="saisie">Saisie</label>
<input id="saisie" name="saisie" type="text" placeholder="756.0000.0000.00">
<label for="caisse">Caisse de compensation</label>
<input id="caisse" name="caisse" type="text">
<p><button type="submit">Envoyer la demande</button></p>
</form>
</main>
