<!DOCTYPE html>
<html lang="it-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visite guidate – Museo della Filanda, Esempiano</title>
<style>body{margin:0;font-family:Verdana, Geneva, sans-serif;color:#102a43;background:#f7fafc;line-height:1.5}a{color:#0a558c}.site-header{background:#1f6f8b;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #c5d5e4;color:#486581;padding:16px 24px;font-size:.9rem}.box{background:#e3eef6;padding:16px;border-radius:8px}.muted{color:#486581}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #1f6f8b;background:#1f6f8b;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #c5d5e4;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #c5d5e4;border-radius:10px;padding:12px;background:#ffffff}form{max-width:540px}</style>
</head>
<body>
<main>
<h1>Visite guidate per gruppi</h1>
<p>Il Museo della Filanda propone visite guidate di un'ora per gruppi fino a 25 persone.</p>
<form action="visita-prenotata.html" method="post">
<label for="gruppo">Nome del gruppo o della scuola</label>
<input id="gruppo" name="gruppo" type="text">
<label for="data-visita">Data della visita</label>
<select id="data-visita" name="data-visita"><option>martedì 10 novembre</option><option>giovedì 12 novembre</option></select>
<label for="valore">Valore</label>
<input id="valore" name="valore" type="number" min="1" max="25">
<p><button type="submit">Prenotare</button></p>
</form>
</main>
</body>
</html>
