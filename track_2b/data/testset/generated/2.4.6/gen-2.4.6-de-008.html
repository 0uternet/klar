<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompostabgabe – Gemeinde Ober-Beispielwil</title>
<style>body{margin:0;font-family:Arial, Helvetica, sans-serif;color:#16181d;background:#ffffff;line-height:1.5}a{color:#1f4fd8}.site-header{background:#2b2f3a;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #d4d7de;color:#50555e;padding:16px 24px;font-size:.9rem}.box{background:#f1f2f5;padding:16px;border-radius:8px}.muted{color:#50555e}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2b2f3a;background:#2b2f3a;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #d4d7de;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #d4d7de;border-radius:10px;padding:12px;background:#ffffff}form{max-width:540px}</style>
</head>
<body>
<main>
<h1>Lieferadresse für die Kompostabgabe</h1>
<p>Der Werkhof liefert Kompost ab 1 m³ gratis innerhalb der Gemeinde.</p>
<form action="kompost-bestellt.html" method="post">
<label for="lf-strasse">Strasse</label>
<input id="lf-strasse" name="lf-strasse" type="text">
<label for="lf-plz">PLZ</label>
<input id="lf-plz" name="lf-plz" type="text" inputmode="numeric">
<label for="lf-ort">Ort</label>
<input id="lf-ort" name="lf-ort" type="text">
<p><button type="submit">Bestellen</button></p>
</form>
</main>
</body>
</html>
