<style>body{margin:0;font-family:'Segoe UI', Tahoma, Verdana, sans-serif;color:#22241f;background:#fbfaf6;line-height:1.5}a{color:#1e5a8c}.site-header{background:#2f5d34;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #cfd6c6;color:#55594f;padding:16px 24px;font-size:.9rem}.box{background:#eef3e8;padding:16px;border-radius:8px}.muted{color:#55594f}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2f5d34;background:#2f5d34;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #cfd6c6;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #cfd6c6;border-radius:10px;padding:12px;background:#ffffff}.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px}@media (max-width:720px){.cols{grid-template-columns:1fr}}.crumbs{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:8px;font-size:.9rem}.crumbs li+li::before{content:'/';margin-right:8px}.tagline{display:inline-block;width:560px;max-width:100%;height:64px;background:url(../_assets/v-tagline-en.svg) left center/contain no-repeat;text-indent:-9999px;overflow:hidden}body.plain .tagline{width:auto;height:auto;background:none;text-indent:0;font-size:1.6rem;font-style:italic}</style>
