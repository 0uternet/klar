<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiuto domiciliare – Comune di Esempiano</title>
<style>body{margin:0;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;color:#1d2327;background:#ffffff;line-height:1.5}a{color:#0b5394}.site-header{background:#0b4f6c;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #c9d3d8;color:#4f5b62;padding:16px 24px;font-size:.9rem}.box{background:#e8f1f5;padding:16px;border-radius:8px}.muted{color:#4f5b62}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #0b4f6c;background:#0b4f6c;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #c9d3d8;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #c9d3d8;border-radius:10px;padding:12px;background:#ffffff}form{max-width:560px}fieldset{border:1px solid #c9d3d8;border-radius:8px;margin:16px 0;padding:8px 14px 14px}legend{font-weight:700}.inline label{display:inline;font-weight:400;margin:0 14px 0 4px}.datum-teile{display:flex;gap:12px}.datum-teile div{flex:0 0 auto}.datum-teile input{width:5em}</style>
</head>
<body>
<main>
<h1>Richiesta di aiuto domiciliare</h1>
<p>Il servizio di aiuto domiciliare sostiene le persone anziane nelle faccende di casa e nella cura personale.</p>
<form action="richiesta-aiuto.html" method="post">
<label for="sp-nome">Il suo nome e cognome</label>
<input id="sp-nome" name="sp-nome" type="text" autocomplete="name">
<label for="sp-telefono">Il suo numero di telefono</label>
<input id="sp-telefono" name="sp-telefono" type="tel" autocomplete="tel">
<label for="medico">Nome del medico curante</label>
<input id="medico" name="medico" type="text">
<label for="bisogno">Di quale aiuto ha bisogno?</label>
<textarea id="bisogno" name="bisogno" rows="3"></textarea>
<p><button type="submit">Invia la richiesta</button></p>
</form>
</main>
</body>
</html>
