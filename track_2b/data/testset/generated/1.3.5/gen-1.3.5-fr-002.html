<body>
<main>
<h1>Demande de rappel</h1>
<p>Laissez-nous votre numéro : un collaborateur de l'administration vous rappelle dans les deux jours ouvrables.</p>
<form action="rappel-merci.html" method="post">
<label for="rappel-nom">Nom et prénom</label>
<input id="rappel-nom" name="rappel-nom" type="text" autocomplete="name">
<label for="rappel-tel">Numéro de téléphone</label>
<input id="rappel-tel" name="rappel-tel" type="tel" autocomplete="phone">
<label for="sujet">Sujet</label>
<select id="sujet" name="sujet"><option>Impôts</option><option>Contrôle des habitants</option><option>Constructions</option></select>
<p><button type="submit">Demander un rappel</button></p>
</form>
<aside class="box news-aside"><h2>Budget 2027</h2><p>Le budget peut être consulté au greffe communal jusqu&#x27;au 20 novembre 2026.</p><p><a href="budget-2027.pdf">Budget 2027 (PDF, 380 Ko)</a></p></aside>
</main>
</body>
