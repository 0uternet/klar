<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte déchetterie – Commune d&#x27;Exempleval</title>
<style>body{margin:0;font-family:Georgia, 'Times New Roman', serif;color:#241c1c;background:#fffdfb;line-height:1.5}a{color:#7a1f2b}.site-header{background:#7a1f2b;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #e0d2d2;color:#5d5050;padding:16px 24px;font-size:.9rem}.box{background:#f7eeee;padding:16px;border-radius:8px}.muted{color:#5d5050}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #7a1f2b;background:#7a1f2b;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #e0d2d2;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #e0d2d2;border-radius:10px;padding:12px;background:#ffffff}form{max-width:560px}fieldset{border:1px solid #c9d3d8;border-radius:8px;margin:16px 0;padding:8px 14px 14px}legend{font-weight:700}.inline label{display:inline;font-weight:400;margin:0 14px 0 4px}.datum-teile{display:flex;gap:12px}.datum-teile div{flex:0 0 auto}.datum-teile input{width:5em}</style>
</head>
<body>
<main>
<h1>Carte d'accès à la déchetterie</h1>
<p>Chaque ménage reçoit une carte d'accès gratuite. Une carte de remplacement coûte CHF 20.–.</p>
<form action="carte-commandee.html" method="post">
<label for="dt-nom">Nom</label>
<input id="dt-nom" name="dt-nom" type="text" autocomplete="family-name">
<label for="dt-prenom">Prénom</label>
<input id="dt-prenom" name="dt-prenom" type="text" autocomplete="given-name">
<label for="dt-adresse">Rue et numéro</label>
<input id="dt-adresse" name="dt-adresse" type="text" autocomplete="street-address">
<label for="dt-npa">NPA</label>
<input id="dt-npa" name="dt-npa" type="text" autocomplete="postal-code">
<label for="dt-localite">Localité</label>
<input id="dt-localite" name="dt-localite" type="text">
<p><button type="submit">Commander la carte</button></p>
</form>
</main>
</body>
</html>
