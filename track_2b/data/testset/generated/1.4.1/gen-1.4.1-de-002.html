<h1>Anmeldung Herbstferien-Angebot</h1><p>Für Kinder von 6 bis 12 Jahren. Anmeldeschluss ist der 25. September.</p><form id="anmeldung" action="anmeldung-danke.html" method="post"><p>Rot markierte Felder müssen ausgefüllt werden.</p><label for="vorname" class="pflicht">Vorname des Kindes</label><input type="text" id="vorname" name="vorname"><label for="nachname" class="pflicht">Nachname des Kindes</label><input type="text" id="nachname" name="nachname"><label for="geburtsdatum" class="pflicht">Geburtsdatum</label><input type="text" id="geburtsdatum" name="geburtsdatum"><label for="allergien">Allergien oder Unverträglichkeiten</label><textarea id="allergien" name="allergien" rows="3"></textarea><label for="notfall" class="pflicht">Telefon Notfallkontakt</label><input type="tel" id="notfall" name="notfall"><p><button type="submit">Anmelden</button></p></form><section><h2>Weitere Meldungen</h2><ul><li><a href="meldung-festtage.html">Geänderte Öffnungszeiten über die Festtage</a></li><li><a href="meldung-kirchweg.html">Kirchweg wegen Leitungsbau gesperrt</a></li><li><a href="meldung-umfrage.html">Ergebnisse der Umfrage zum Ortsbus</a></li></ul></section>
