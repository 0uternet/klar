<div class="cols"><div><h1>Iscrizione al corso di tedesco per adulti</h1><p>Il corso si svolge il mercoledì sera dalle 19.00 alle 20.30 nella sede della scuola media. Costo: CHF 240.– per 12 serate.</p><form id="iscrizione" action="iscrizione-inviata.html" method="post"><p>I campi in rosso sono obbligatori.</p><label for="nome" class="obbl">Nome</label><input type="text" id="nome" name="nome"><label for="cognome" class="obbl">Cognome</label><input type="text" id="cognome" name="cognome"><label for="email" class="obbl">E-mail</label><input type="email" id="email" name="email"><label for="tel">Telefono</label><input type="tel" id="tel" name="tel"><label for="osservazioni">Osservazioni</label><textarea id="osservazioni" name="osservazioni" rows="3"></textarea><p><button type="submit">Invia l'iscrizione</button></p></form></div><aside><section><h2>Numeri d'emergenza</h2><ul><li>Pompieri 118</li><li>Polizia 117</li><li>Ambulanza 144</li></ul></section></aside></div>
