<head>
<meta charset="utf-8">

<title>Commande de sacs taxés – Commune d&#x27;Exempleval</title>
<style>body{margin:0;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;color:#1d2327;background:#ffffff;line-height:1.5}a{color:#0b5394}.site-header{background:#0b4f6c;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #c9d3d8;color:#4f5b62;padding:16px 24px;font-size:.9rem}.box{background:#e8f1f5;padding:16px;border-radius:8px}.muted{color:#4f5b62}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #0b4f6c;background:#0b4f6c;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #c9d3d8;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #c9d3d8;border-radius:10px;padding:12px;background:#ffffff}.fld{margin:0 0 14px}.fld label{margin-top:0}.hint{margin:2px 0 4px;font-size:.92rem;color:#4b5563}.err{margin:4px 0 0;color:#a3001b;font-weight:600;min-height:0}.is-invalid{border:2px solid #c8102e;background:#fff1f2}.msgbox{border:2px solid #a3001b;background:#fff6f6;padding:10px 14px;border-radius:6px;margin:0 0 16px}.okbox{border:2px solid #2f6b3a;background:#eef7ef;padding:10px 14px;border-radius:6px;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:0 18px}.row .fld{flex:1 1 180px}fieldset{border:1px solid #c5ccd3;border-radius:8px;padding:8px 16px 4px;margin:0 0 16px}legend{font-weight:700;padding:0 4px}.req{color:#a3001b}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.icon-slot svg{vertical-align:middle;margin-left:6px}.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn-sec{background:#ffffff;color:#1d2327;border:1px solid #6b7280}aside.box{margin-top:24px}.dialog{position:fixed;left:50%;top:20%;transform:translateX(-50%);max-width:440px;background:#ffffff;border:2px solid #1d2327;border-radius:10px;padding:16px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}.crumbs{font-size:.9rem;margin:0 0 8px}</style>
</head>
<body>
<main>
<h1>Commande de sacs taxés</h1>
<p>Les sacs taxés sont livrés à domicile par rouleaux de dix. La facture suit avec la livraison.</p>
<form id="sacs" novalidate><div class="fld"><label for="client">Nom et adresse</label><input id="client" name="client" type="text" aria-describedby="err-client"><p class="err" id="err-client"></p></div><div class="row"><div class="fld"><label for="taille">Taille des sacs (litres)</label><input id="taille" name="taille" type="text" aria-describedby="err-taille" size="8"><p class="err" id="err-taille"></p></div><div class="fld"><label for="rouleaux">Nombre de rouleaux</label><input id="rouleaux" name="rouleaux" type="text" aria-describedby="err-rouleaux" inputmode="numeric" size="4"><p class="err" id="err-rouleaux"></p></div></div><div class="actions"><button type="submit">Envoyer</button></div></form><div class="okbox" id="merci" tabindex="-1" hidden><p>Merci ! Vos données ont bien été transmises.</p></div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var form = document.getElementById("sacs");
  var done = document.getElementById("merci");
  var rules = [
    {f:"client",t:function(v){return v !== "";},m:"Indiquez votre nom et votre adresse.",o:"text",x:"err-client",mk:1,ln:0},
    {f:"taille",t:function(v){return ["17","35","60","110"].indexOf(v.toLowerCase().replace(/\s*(l|litres)$/, "")) >= 0;},m:"Taille des sacs : les tailles disponibles sont 17, 35, 60 et 110 litres.",o:"text",x:"err-taille",mk:1,ln:0},
    {f:"rouleaux",t:function(v){return /^\d+$/.test(v) && +v >= 1 && +v <= 10;},m:"Nombre de rouleaux : entre 1 et 10.",o:"text",x:"err-rouleaux",mk:1,ln:0}
  ];
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var first = null, items = [];
    done.hidden = true;
    rules.forEach(function (r) {
      var f = document.getElementById(r.f);
      var v = f.value.trim(), ok = r.t(v);
      r.cur = (!ok && r.mf) ? r.mf(v) : r.m;
      var x = r.x ? document.getElementById(r.x) : null;
      if (r.mk) { if (ok) { f.removeAttribute("aria-invalid"); f.classList.remove("is-invalid"); }
                  else { f.setAttribute("aria-invalid", "true"); f.classList.add("is-invalid"); } }
      if (r.o === "text") { x.textContent = ok ? "" : r.cur; if (x.hasAttribute("hidden") || ok) { x.hidden = ok; } }
      if (r.o === "show") { x.hidden = ok; }
      if (!ok) { items.push(r); if (!first) { first = f; } }
    });
    if (first) { first.focus(); return; }
    done.hidden = false; done.focus();
  });
});
</script>
</body>
</html>
