<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auszahlung des Vereinsbeitrags 2026 – Gemeinde Fiktal</title>
<style>body{margin:0;font-family:Georgia, 'Times New Roman', serif;color:#241c1c;background:#fffdfb;line-height:1.5}a{color:#7a1f2b}.site-header{background:#7a1f2b;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #e0d2d2;color:#5d5050;padding:16px 24px;font-size:.9rem}.box{background:#f7eeee;padding:16px;border-radius:8px}.muted{color:#5d5050}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #7a1f2b;background:#7a1f2b;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #e0d2d2;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #e0d2d2;border-radius:10px;padding:12px;background:#ffffff}.fld{margin:0 0 14px}.fld label{margin-top:0}.hint{margin:2px 0 4px;font-size:.92rem;color:#4b5563}.err{margin:4px 0 0;color:#a3001b;font-weight:600;min-height:0}.is-invalid{border:2px solid #c8102e;background:#fff1f2}.msgbox{border:2px solid #a3001b;background:#fff6f6;padding:10px 14px;border-radius:6px;margin:0 0 16px}.okbox{border:2px solid #2f6b3a;background:#eef7ef;padding:10px 14px;border-radius:6px;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:0 18px}.row .fld{flex:1 1 180px}fieldset{border:1px solid #c5ccd3;border-radius:8px;padding:8px 16px 4px;margin:0 0 16px}legend{font-weight:700;padding:0 4px}.req{color:#a3001b}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.icon-slot svg{vertical-align:middle;margin-left:6px}.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn-sec{background:#ffffff;color:#1d2327;border:1px solid #6b7280}aside.box{margin-top:24px}.dialog{position:fixed;left:50%;top:20%;transform:translateX(-50%);max-width:440px;background:#ffffff;border:2px solid #1d2327;border-radius:10px;padding:16px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}.crumbs{font-size:.9rem;margin:0 0 8px}</style>
</head>
<body>
<main>
<h1>Auszahlung des Vereinsbeitrags 2026</h1>
<p>Ortsvereine mit Jugendabteilung erhalten einen Beitrag von CHF 30.– pro aktivem Kind. Der Betrag wird im Dezember überwiesen.</p>
<form id="beitrag" novalidate><div class="fld"><label for="verein">Name des Vereins</label><input id="verein" name="verein" type="text" aria-describedby="err-verein"><p class="err" id="err-verein"></p></div><div class="fld"><label for="inhaber">Kontoinhaberin / Kontoinhaber</label><input id="inhaber" name="inhaber" type="text" aria-describedby="err-inhaber"><p class="err" id="err-inhaber"></p></div><div class="fld"><label for="iban">IBAN</label><input id="iban" name="iban" type="text" aria-describedby="err-iban"><p class="err" id="err-iban"></p></div><div class="fld"><label for="kinder">Anzahl Kinder und Jugendliche</label><input id="kinder" name="kinder" type="text" aria-describedby="err-kinder" inputmode="numeric" size="5"><p class="err" id="err-kinder"></p></div><div class="actions"><button type="submit">Absenden</button></div></form><div class="okbox" id="danke" tabindex="-1" hidden><p>Vielen Dank! Ihre Angaben wurden übermittelt.</p></div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var form = document.getElementById("beitrag");
  var done = document.getElementById("danke");
  var rules = [
    {f:"verein",t:function(v){return v !== "";},m:"Bitte geben Sie den Namen des Vereins ein.",o:"text",x:"err-verein",mk:1,ln:0},
    {f:"inhaber",t:function(v){return v !== "";},m:"Bitte geben Sie an, auf wen das Konto lautet.",o:"text",x:"err-inhaber",mk:1,ln:0},
    {f:"iban",t:function(v){return /^CH\d{19}$/.test(v.replace(/\s+/g, "").toUpperCase());},m:"IBAN fehlerhaft.",o:"text",x:"err-iban",mk:1,ln:0},
    {f:"kinder",t:function(v){return /^\d+$/.test(v) && +v >= 1 && +v <= 500;},m:"Bitte geben Sie die Anzahl als ganze Zahl ein, z. B. 24.",o:"text",x:"err-kinder",mk:1,ln:0}
  ];
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var first = null, items = [];
    done.hidden = true;
    rules.forEach(function (r) {
      var f = document.getElementById(r.f);
      var v = f.value.trim(), ok = r.t(v);
      r.cur = (!ok && r.mf) ? r.mf(v) : r.m;
      var x = r.x ? document.getElementById(r.x) : null;
      if (r.mk) { if (ok) { f.removeAttribute("aria-invalid"); f.classList.remove("is-invalid"); }
                  else { f.setAttribute("aria-invalid", "true"); f.classList.add("is-invalid"); } }
      if (r.o === "text") { x.textContent = ok ? "" : r.cur; if (x.hasAttribute("hidden") || ok) { x.hidden = ok; } }
      if (r.o === "show") { x.hidden = ok; }
      if (!ok) { items.push(r); if (!first) { first = f; } }
    });
    if (first) { first.focus(); return; }
    done.hidden = false; done.focus();
  });
});
</script>
</body>
</html>
