<!DOCTYPE html>
<html lang="it-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La sagra in immagini – Città di Modellina</title>
<style>body{margin:0;font-family:'Segoe UI', Tahoma, Verdana, sans-serif;color:#22241f;background:#fbfaf6;line-height:1.5}a{color:#1e5a8c}.site-header{background:#2f5d34;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #cfd6c6;color:#55594f;padding:16px 24px;font-size:.9rem}.box{background:#eef3e8;padding:16px;border-radius:8px}.muted{color:#55594f}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2f5d34;background:#2f5d34;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #cfd6c6;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #cfd6c6;border-radius:10px;padding:12px;background:#ffffff}.slider{position:relative;max-width:560px;touch-action:pan-y;user-select:none}.slides{list-style:none;margin:0;padding:0}.slides li{display:none}.slides li.on{display:block}.slider-nav{display:flex;gap:8px;margin-top:8px}.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var root = document.querySelector('.slider'); var items = root.querySelectorAll('.slides li');
  var i = 0, x0 = null;
  function show(n) { items[i].classList.remove('on'); i = (n + items.length) % items.length; items[i].classList.add('on');
    document.getElementById('slide-status').textContent = (i + 1) + ' / ' + items.length; }
  root.querySelector('.prev').addEventListener('click', function () { show(i - 1); });
  root.querySelector('.next').addEventListener('click', function () { show(i + 1); });
  root.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
  root.addEventListener('pointerup', function (e) { if (x0 !== null && Math.abs(e.clientX - x0) > 40) { show(e.clientX < x0 ? i + 1 : i - 1); } x0 = null; });
  root.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, {passive: true});
  root.addEventListener('touchend', function (e) { var x = e.changedTouches[0].clientX; if (x0 !== null && Math.abs(x - x0) > 40) { show(x < x0 ? i + 1 : i - 1); } x0 = null; });
});
</script></head>
<body>
<header class="site-header"><a class="site-name" href="index.html">Città di Modellina</a><nav class="site-nav" aria-label="Navigazione principale"><ul><li><a href="home.html">Home</a></li><li><a href="attualita.html">Attualità</a></li><li><a href="amministrazione.html">Amministrazione</a></li><li><a href="vita-quotidiana.html">Vita quotidiana</a></li><li><a href="tempo-libero.html">Tempo libero</a></li></ul></nav></header>
<main>
<h1>La sagra in immagini</h1><div class="slider" id="foto-sagra"><ul class="slides"><li class="on"><img src="../_assets/slide-foto-sagra-0.svg" alt="Corteo storico in piazza" width="520" height="280"></li><li><img src="../_assets/slide-foto-sagra-1.svg" alt="Laboratorio per bambini" width="520" height="280"></li><li><img src="../_assets/slide-foto-sagra-2.svg" alt="Concerto della filarmonica" width="520" height="280"></li></ul><div class="slider-nav"><button type="button" class="prev">Immagine precedente</button><span id="slide-status" aria-live="polite">1 / 3</span><button type="button" class="next">Immagine successiva</button></div></div>
</main>
<footer class="site-footer"><p>Città di Modellina · Via ai Ronchi 5 · <a href="kontakt.html">Contatto</a></p></footer>
</body>
</html>
