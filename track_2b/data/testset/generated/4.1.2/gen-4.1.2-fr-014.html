<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon panier de cartes journalières – Commune de Valfictif</title>
<style>body{margin:0;font-family:Arial, Helvetica, sans-serif;color:#16181d;background:#ffffff;line-height:1.5}a{color:#1f4fd8}.site-header{background:#2b2f3a;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #d4d7de;color:#50555e;padding:16px 24px;font-size:.9rem}.box{background:#f1f2f5;padding:16px;border-radius:8px}.muted{color:#50555e}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2b2f3a;background:#2b2f3a;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #d4d7de;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #d4d7de;border-radius:10px;padding:12px;background:#ffffff}.btn-look{display:inline-block;padding:8px 16px;border-radius:6px;background:#2f5d34;color:#ffffff;cursor:pointer}.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var b = document.querySelector('.action-clear');
  b.addEventListener('click', function () { document.querySelector('.saved').innerHTML = ''; document.getElementById('saved-msg').textContent = b.dataset.done; });
});
</script></head>
<body>
<main>
<h1>Mon panier de cartes journalières</h1><ul class="saved"><li>Carte journalière du 12 mars</li><li>Carte journalière du 19 mars</li></ul><div class="action-clear btn-look" id="liste-leeren" data-done="Le panier est vide.">Vider le panier</div><p id="saved-msg" aria-live="polite"></p>
</main>
</body>
</html>
