<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiers balisés autour du village – Commune de Valfictif</title>
<style>body{margin:0;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;color:#1d2327;background:#ffffff;line-height:1.5}a{color:#0b5394}.site-header{background:#0b4f6c;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #c9d3d8;color:#4f5b62;padding:16px 24px;font-size:.9rem}.box{background:#e8f1f5;padding:16px;border-radius:8px}.muted{color:#4f5b62}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #0b4f6c;background:#0b4f6c;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #c9d3d8;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #c9d3d8;border-radius:10px;padding:12px;background:#ffffff}.map{width:560px;max-width:100%;height:300px;overflow:hidden;border:2px solid #4f5b62;border-radius:8px}.map:focus{outline:3px solid #0b5394}.map-layer{transform-origin:center}.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var map = document.querySelector('.map'); var x = 0, y = 0, z = 1, drag = null;
  function draw() { map.querySelector('.map-layer').style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + z + ')'; }
  map.addEventListener('keydown', function (e) {
    var s = 20; if (e.key === 'ArrowLeft') x += s; else if (e.key === 'ArrowRight') x -= s;
    else if (e.key === 'ArrowUp') y += s; else if (e.key === 'ArrowDown') y -= s;
    else if (e.key === '+') z = Math.min(3, z + 0.25); else if (e.key === '-') z = Math.max(1, z - 0.25); else return;
    e.preventDefault(); draw(); });
  map.addEventListener('pointerdown', function (e) { drag = [e.clientX - x, e.clientY - y]; });
  map.addEventListener('pointermove', function (e) { if (drag) { x = e.clientX - drag[0]; y = e.clientY - drag[1]; draw(); } });
  map.addEventListener('pointerup', function () { drag = null; });
  var zin = document.getElementById('zoom-in'), zout = document.getElementById('zoom-out');
  if (zin) zin.addEventListener('click', function () { z = Math.min(3, z + 0.25); draw(); });
  if (zout) zout.addEventListener('click', function () { z = Math.max(1, z - 0.25); draw(); });
});
</script></head>
<body>
<main>
<h1>Sentiers balisés autour du village</h1><p class="muted">Carte des sentiers</p><div class="map" id="karte-2" tabindex="0"><div class="map-layer"><img src="../_assets/plan-mountain-2.svg" alt=""></div></div><p>Utilisez les flèches pour déplacer la carte.</p><ul><li>Sentier des Crêtes : 2 h 30, difficulté moyenne</li><li>Tour du Marais : 1 h, facile</li></ul>
</main>
</body>
</html>
