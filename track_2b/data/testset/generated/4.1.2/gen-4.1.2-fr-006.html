<!DOCTYPE html>

<head>

<title>Notifications – Ville de Bourg-Modèle</title>
<style>body{margin:0;font-family:Arial, Helvetica, sans-serif;color:#16181d;background:#ffffff;line-height:1.5}a{color:#1f4fd8}.site-header{background:#2b2f3a;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #d4d7de;color:#50555e;padding:16px 24px;font-size:.9rem}.box{background:#f1f2f5;padding:16px;border-radius:8px}.muted{color:#50555e}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2b2f3a;background:#2b2f3a;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #d4d7de;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #d4d7de;border-radius:10px;padding:12px;background:#ffffff}.btn{display:inline-block;padding:8px 16px;border-radius:6px;text-decoration:none;font-weight:600;background:#0b4f6c;color:#ffffff}.panel{border:1px solid #c9d3d8;border-radius:8px;padding:10px 14px;margin-top:8px}.chev svg{transition:transform .2s}.aperto .chev svg{transform:rotate(90deg)}.interrupteur{display:flex;align-items:center;gap:10px}.interrupteur button{width:52px;height:28px;border-radius:14px;padding:0;background:#6b7280;border-color:#6b7280;position:relative}.interrupteur button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#ffffff}.interrupteur button[aria-checked="true"]{background:#2f5d34;border-color:#2f5d34}.interrupteur button[aria-checked="true"]::after{left:27px}</style>
</head>
<body>
<main>
<h1>Mes notifications</h1>
<div class="interrupteur"><button type="button" role="switch" id="rappel-dechets" aria-checked="false" aria-labelledby="lbl-rappel"></button>
<span id="lbl-rappel">Rappel par SMS la veille du ramassage</span></div>
<script>
document.getElementById('rappel-dechets').addEventListener('click', function () {
  this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
});
</script>
<aside class="box news-aside"><h2>Fermeture de la rue des Granges</h2><p>En raison de travaux, la rue des Granges est fermée du 3 au 7 novembre 2026. Les bus empruntent l&#x27;avenue de la Gare.</p><p><a href="deviation.html">Plan de déviation</a></p></aside>
</main>
</body>
