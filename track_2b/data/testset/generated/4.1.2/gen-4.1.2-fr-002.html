<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de gymnastique – Ville de Bourg-Modèle</title>
<style>body{margin:0;font-family:Georgia, 'Times New Roman', serif;color:#241c1c;background:#fffdfb;line-height:1.5}a{color:#7a1f2b}.site-header{background:#7a1f2b;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #e0d2d2;color:#5d5050;padding:16px 24px;font-size:.9rem}.box{background:#f7eeee;padding:16px;border-radius:8px}.muted{color:#5d5050}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #7a1f2b;background:#7a1f2b;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #e0d2d2;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #e0d2d2;border-radius:10px;padding:12px;background:#ffffff}.btn{display:inline-block;padding:8px 16px;border-radius:6px;text-decoration:none;font-weight:600;background:#0b4f6c;color:#ffffff}.panel{border:1px solid #c9d3d8;border-radius:8px;padding:10px 14px;margin-top:8px}.chev svg{transition:transform .2s}.aperto .chev svg{transform:rotate(90deg)}.coche{display:flex;align-items:center;gap:10px;margin-top:14px}.coche .case{width:22px;height:22px;border:2px solid #1d2327;border-radius:4px;cursor:pointer}.coche .case.cochee{background:#0b4f6c;box-shadow:inset 0 0 0 3px #ffffff}</style>
</head>
<body>
<main>
<h1>Location de la salle de gymnastique</h1>
<form action="location-envoyee.html" method="post">
<label for="societe">Nom de la société</label>
<input id="societe" name="societe" type="text">
<div class="coche"><div class="case" role="checkbox" tabindex="0" id="reglement" aria-labelledby="txt-reglement"></div>
<span id="txt-reglement">J'ai lu le règlement d'utilisation de la salle</span></div>
<p><button type="submit">Envoyer la demande</button></p>
</form>
<script>
(function () {
  var c = document.getElementById('reglement');
  function basculer() { c.classList.toggle('cochee'); }
  c.addEventListener('click', basculer);
  c.addEventListener('keydown', function (e) { if (e.key === ' ') { e.preventDefault(); basculer(); } });
})();
</script>
</main>
</body>
</html>
