<!DOCTYPE html>
<html lang="it-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disdetta posteggio – Comune di Valfittizia</title>
<style>body{margin:0;font-family:Verdana, Geneva, sans-serif;color:#102a43;background:#f7fafc;line-height:1.5}a{color:#0a558c}.site-header{background:#1f6f8b;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #c5d5e4;color:#486581;padding:16px 24px;font-size:.9rem}.box{background:#e3eef6;padding:16px;border-radius:8px}.muted{color:#486581}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #1f6f8b;background:#1f6f8b;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #c5d5e4;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #c5d5e4;border-radius:10px;padding:12px;background:#ffffff}.azioni{display:flex;justify-content:space-between;align-items:center;margin-top:20px;border-top:1px solid #c9d3d8;padding-top:12px}.azioni .stampa{background:#ffffff;color:#1d2327;border:1px solid #6b7280;padding:8px}</style>
</head>
<body>
<main>
<h1>Disdetta del posteggio comunale</h1>
<p id="istruzione-copia">Per conservare una copia, premi il pulsante in basso a sinistra prima di inviare il modulo.</p>
<form action="disdetta-inviata.html" method="post">
<label for="numero-posteggio">Numero del posteggio</label>
<input id="numero-posteggio" name="numero-posteggio" type="text">
<label for="data-disdetta">Disdetta a partire dal</label>
<input id="data-disdetta" name="data-disdetta" type="text" placeholder="gg.mm.aaaa">
<div class="azioni">
<button type="button" class="stampa" aria-label="Stampa" onclick="window.print()"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H4v-8h16v8h-3"/><rect x="7" y="14" width="10" height="7"/></g></svg></button>
<button type="submit">Invia la disdetta</button>
</div>
</form>
</main>
</body>
</html>
