<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Carte de stationnement – Ville de Bourg-Modèle</title>
<style>body{margin:0;font-family:Arial, Helvetica, sans-serif;color:#16181d;background:#ffffff;line-height:1.5}a{color:#1f4fd8}.site-header{background:#2b2f3a;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #d4d7de;color:#50555e;padding:16px 24px;font-size:.9rem}.box{background:#f1f2f5;padding:16px;border-radius:8px}.muted{color:#50555e}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2b2f3a;background:#2b2f3a;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #d4d7de;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #d4d7de;border-radius:10px;padding:12px;background:#ffffff}.choix label{display:inline;font-weight:400;margin:0 14px 0 4px}fieldset{border:1px solid #c9d3d8;border-radius:8px}</style>
</head>
<body>
<main>
<h1>Commande d'une carte de stationnement</h1>
<form action="commande-envoyee.html" method="post">
<label for="plaque">Numéro de plaque</label>
<input id="plaque" name="plaque" type="text" placeholder="VD 123 456">
<fieldset id="paiement">
<legend>Mode de paiement</legend>
<p class="choix"><input type="radio" id="pay-facture" name="paiement" value="facture"><label for="pay-facture">Facture</label>
<input type="radio" id="pay-twint" name="paiement" value="twint"><label for="pay-twint">TWINT</label>
<input type="radio" id="pay-guichet" name="paiement" value="guichet"><label for="pay-guichet">Au guichet</label></p>
</fieldset>
<p><button type="submit">Commander</button></p>
</form>
<aside class="box news-aside"><h2>Ludothèque ouverte le samedi</h2><p>Dès décembre, la ludothèque vous accueille aussi le samedi de 9 h 30 à 11 h 30.</p><p><a href="ludotheque.html">Offre de la ludothèque</a></p></aside>
</main>
</body>
</html>
