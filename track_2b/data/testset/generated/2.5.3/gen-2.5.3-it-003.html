<!DOCTYPE html>

<head>

<title>Sentiero del castagno – Comune di Valfittizia</title>
<style>body{margin:0;font-family:'Segoe UI', Tahoma, Verdana, sans-serif;color:#22241f;background:#fbfaf6;line-height:1.5}a{color:#1e5a8c}.site-header{background:#2f5d34;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #cfd6c6;color:#55594f;padding:16px 24px;font-size:.9rem}.box{background:#eef3e8;padding:16px;border-radius:8px}.muted{color:#55594f}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2f5d34;background:#2f5d34;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #cfd6c6;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #cfd6c6;border-radius:10px;padding:12px;background:#ffffff}.btn{display:inline-block;padding:8px 16px;border-radius:6px;text-decoration:none;font-weight:600}form{max-width:540px}.schede{display:flex;gap:4px;border-bottom:2px solid #1f6f8b}.schede button{border-radius:6px 6px 0 0;background:#ffffff;color:#1d2327;border:1px solid #1f6f8b}.schede button[aria-pressed="true"]{background:#1f6f8b;color:#ffffff}</style>
</head>
<body>
<main>
<h1>Sentiero didattico del castagno</h1>
<div class="schede">
<button type="button" id="scheda-descrizione" aria-pressed="true">Descrizione</button>
<button type="button" id="scheda-mappa" aria-pressed="false" aria-label="Cartina del percorso">Mappa</button>
</div>
<p>Un percorso di 4 km con dodici pannelli sulla coltura del castagno, adatto anche alle famiglie.</p>
</main>
</body>
