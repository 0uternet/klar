<svg xmlns="http://www.w3.org/2000/svg" width="460" height="620" viewBox="0 0 460 620"><rect width="460" height="620" fill="#fbfaf4"/><text x="40" y="60" text-anchor="start" font-family="'Times New Roman', serif" font-size="15" font-weight="700" fill="#2b2b2b">COMMUNE DE VALFICTIF – MUNICIPALITÉ</text><line x1="40" y1="72" x2="420" y2="72" stroke="#2b2b2b" stroke-width="1"/><text x="40" y="118" text-anchor="start" font-family="'Times New Roman', serif" font-size="19" font-weight="700" fill="#1a1a1a">Arrêté municipal du 5 octobre 2026</text><text x="40" y="156" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">La Municipalité de Valfictif,</text><text x="40" y="177" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">vu la loi sur la circulation routière,</text><text x="40" y="198" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">vu le règlement communal de police,</text><text x="40" y="231" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">arrête :</text><text x="40" y="252" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">Article premier. – La rue de l&#x27;Église est interdite à</text><text x="40" y="273" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">tout véhicule du 2 au 20 novembre 2026,</text><text x="40" y="294" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">riverains et services d&#x27;urgence exceptés.</text><text x="40" y="327" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">Art. 2. – Le présent arrêté entre en vigueur dès sa</text><text x="40" y="348" text-anchor="start" font-family="'Times New Roman', serif" font-size="14" font-weight="400" fill="#2b2b2b">publication.</text><path d="M250 421 c20 -30 30 10 45 -12 s20 -10 30 8 s25 -20 40 -4" fill="none" stroke="#1d3c8a" stroke-width="2.2" stroke-linecap="round"/><text x="250" y="451" text-anchor="start" font-family="'Times New Roman', serif" font-size="13" font-weight="400" fill="#2b2b2b">Le syndic : Marc Modèle</text><circle cx="110" cy="431" r="44" fill="none" stroke="#7a3fa0" stroke-width="3" opacity="0.8"/><circle cx="110" cy="431" r="34" fill="none" stroke="#7a3fa0" stroke-width="1.5" opacity="0.8"/><text x="110" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7a3fa0">SCEAU</text></svg>