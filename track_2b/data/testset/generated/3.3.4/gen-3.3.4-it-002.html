<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I miei documenti – Comune di Valfittizia</title>
<style>body{margin:0;font-family:Verdana, Geneva, sans-serif;color:#102a43;background:#f7fafc;line-height:1.5}a{color:#0a558c}.site-header{background:#1f6f8b;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #c5d5e4;color:#486581;padding:16px 24px;font-size:.9rem}.box{background:#e3eef6;padding:16px;border-radius:8px}.muted{color:#486581}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #1f6f8b;background:#1f6f8b;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #c5d5e4;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #c5d5e4;border-radius:10px;padding:12px;background:#ffffff}.fld{margin:0 0 14px}.fld label{margin-top:0}.hint{margin:2px 0 4px;font-size:.92rem;color:#4b5563}.err{margin:4px 0 0;color:#a3001b;font-weight:600;min-height:0}.is-invalid{border:2px solid #c8102e;background:#fff1f2}.msgbox{border:2px solid #a3001b;background:#fff6f6;padding:10px 14px;border-radius:6px;margin:0 0 16px}.okbox{border:2px solid #2f6b3a;background:#eef7ef;padding:10px 14px;border-radius:6px;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:0 18px}.row .fld{flex:1 1 180px}fieldset{border:1px solid #c5ccd3;border-radius:8px;padding:8px 16px 4px;margin:0 0 16px}legend{font-weight:700;padding:0 4px}.req{color:#a3001b}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.icon-slot svg{vertical-align:middle;margin-left:6px}.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn-sec{background:#ffffff;color:#1d2327;border:1px solid #6b7280}aside.box{margin-top:24px}.dialog{position:fixed;left:50%;top:20%;transform:translateX(-50%);max-width:440px;background:#ffffff;border:2px solid #1d2327;border-radius:10px;padding:16px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}.crumbs{font-size:.9rem;margin:0 0 8px}</style>
</head>
<body>
<main>
<h1>I miei documenti</h1>
<p>Qui trova i documenti che ha caricato per le sue richieste allo sportello online.</p>
<form id="documenti-form" novalidate><fieldset><legend>Documenti caricati</legend><div><input type="checkbox" id="doc-1" name="documenti" value="Contratto di locazione.pdf"> <label for="doc-1" style="display:inline;font-weight:400">Contratto di locazione.pdf</label></div><div><input type="checkbox" id="doc-2" name="documenti" value="Certificato di salario 2025.pdf"> <label for="doc-2" style="display:inline;font-weight:400">Certificato di salario 2025.pdf</label></div><div><input type="checkbox" id="doc-3" name="documenti" value="Polizza assicurazione economia domestica.pdf"> <label for="doc-3" style="display:inline;font-weight:400">Polizza assicurazione economia domestica.pdf</label></div></fieldset><div class="actions"><button type="submit">Elimina i documenti selezionati</button></div></form><div class="okbox" id="ricevuta" tabindex="-1" hidden><p>I documenti selezionati sono stati eliminati definitivamente.</p></div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var form = document.getElementById("documenti-form"), receipt = document.getElementById("ricevuta");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    form.hidden = true;
    receipt.hidden = false;
    receipt.focus();
  });
});
</script>
</body>
</html>
