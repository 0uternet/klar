<h1>Iscrizione online</h1><p>La tessera è gratuita fino ai 18 anni.</p><form action="grazie.html" method="post"><label for="nome">Nome e cognome</label><input id="nome" name="nome" autocomplete="name"><fieldset id="nascita"><legend>Data di nascita</legend><div class="seg"><label class="vh" for="nascita-1">Giorno</label><input id="nascita-1" name="nascita-1" maxlength="2" size="2" inputmode="numeric"><span aria-hidden="true">–</span><label class="vh" for="nascita-2">Mese</label><input id="nascita-2" name="nascita-2" maxlength="2" size="2" inputmode="numeric"><span aria-hidden="true">–</span><label class="vh" for="nascita-3">Anno</label><input id="nascita-3" name="nascita-3" maxlength="4" size="4" inputmode="numeric"></div></fieldset><script>(function(){var f=document.querySelectorAll('#nascita input');f.forEach(function(inp,i){inp.addEventListener('input',function(){if(inp.value.length>=inp.maxLength&&f[i+1]){f[i+1].focus();}});});})();</script><label for="mail">E-mail</label><input id="mail" name="mail" type="email" autocomplete="email"><button type="submit">Invia</button></form>
