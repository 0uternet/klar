<title>Nos collections – Bibliothèque de Bourg-Modèle</title>
<style>body{margin:0;font-family:Arial, Helvetica, sans-serif;color:#16181d;background:#ffffff;line-height:1.5}a{color:#1f4fd8}.site-header{background:#2b2f3a;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #d4d7de;color:#50555e;padding:16px 24px;font-size:.9rem}.box{background:#f1f2f5;padding:16px;border-radius:8px}.muted{color:#50555e}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2b2f3a;background:#2b2f3a;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #d4d7de;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #d4d7de;border-radius:10px;padding:12px;background:#ffffff}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.skip{position:absolute;left:-9999px;top:4px;background:#ffffff;color:#000000;padding:6px 10px}.skip:focus{left:8px;z-index:20}.cols{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:24px;max-width:1100px;margin:0 auto;padding:0 16px}.cols main{margin:0;max-width:none;padding:24px 0}.side-nav ul{list-style:none;margin:24px 0;padding:0 0 0 10px;border-left:3px solid #8a96a0}.side-nav li{margin:0 0 8px}.side-nav li ul{margin:6px 0 4px;border-left:0;font-size:.95rem}.band{padding:8px 24px;border-bottom:1px solid #c9d3d8}.band ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:18px}.band li ul{display:inline-flex;gap:10px;margin-left:8px;font-size:.92rem}[aria-current=page]{font-weight:700;text-decoration:underline}.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0 0 12px;font-size:.9rem}.crumbs li+li::before{content:'›';margin-right:6px}.foot-links ul{list-style:none;display:flex;flex-wrap:wrap;gap:16px;padding:0;margin:8px 0}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.search{display:flex;gap:6px;align-items:center}.search label{margin:0;font-weight:400}.hits{flex-basis:100%}.teasers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:0;list-style:none}.teasers li{border:1px solid #c9d3d8;border-radius:8px;padding:10px}.lang-switch ul{list-style:none;display:flex;gap:8px;margin:0;padding:0}form{max-width:620px}fieldset{border:1px solid #c9d3d8;border-radius:8px;margin:12px 0;padding:8px 14px 14px}button{margin-top:12px}.seg{display:flex;gap:8px;align-items:center}.seg input{width:4.5em}.seg label{display:inline;margin:0;font-weight:400}.inline label{display:inline;font-weight:400;margin-right:14px}.hint{color:#4f5b62;font-size:.95rem;margin:4px 0}</style>

<h1>Nos collections</h1>
<p>Romans, documentaires, bandes dessinées, livres en gros caractères et livres audio : tout s&#x27;emprunte pour quatre semaines.</p><aside class="box"><div class="field"><label for="rubrique">Aller à la rubrique</label><select id="rubrique" name="rubrique"><option value="">Choisir …</option><option value="horaires.html">Horaires</option><option value="inscription.html">Inscription et tarifs</option><option value="numerique.html">Offre numérique</option><option value="animations.html">Animations</option></select></div><script>(function(){document.getElementById('rubrique').addEventListener('change',function(){if(this.value){window.location.href=this.value;}});})();</script></aside>
