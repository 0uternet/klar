<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription au tournoi de unihockey – Club sportif d&#x27;Exempleval</title>
<style>body{margin:0;font-family:'Segoe UI', Tahoma, Verdana, sans-serif;color:#22241f;background:#fbfaf6;line-height:1.5}a{color:#1e5a8c}.site-header{background:#2f5d34;color:#ffffff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.site-header a{color:#ffffff}.site-name{font-weight:700;font-size:1.15rem;text-decoration:none}.site-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px}.site-nav a{text-decoration:none}main{max-width:960px;margin:0 auto;padding:24px}.site-footer{border-top:1px solid #cfd6c6;color:#55594f;padding:16px 24px;font-size:.9rem}.box{background:#eef3e8;padding:16px;border-radius:8px}.muted{color:#55594f}img{max-width:100%;height:auto}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #6b7280;border-radius:6px}button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid #2f5d34;background:#2f5d34;color:#ffffff;cursor:pointer}table{border-collapse:collapse}th,td{border:1px solid #cfd6c6;padding:6px 10px;text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #cfd6c6;border-radius:10px;padding:12px;background:#ffffff}.fld{margin:0 0 14px}.fld label{margin-top:0}.hint{margin:2px 0 4px;font-size:.92rem;color:#4b5563}.err{margin:4px 0 0;color:#a3001b;font-weight:600;min-height:0}.is-invalid{border:2px solid #c8102e;background:#fff1f2}.msgbox{border:2px solid #a3001b;background:#fff6f6;padding:10px 14px;border-radius:6px;margin:0 0 16px}.okbox{border:2px solid #2f6b3a;background:#eef7ef;padding:10px 14px;border-radius:6px;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:0 18px}.row .fld{flex:1 1 180px}fieldset{border:1px solid #c5ccd3;border-radius:8px;padding:8px 16px 4px;margin:0 0 16px}legend{font-weight:700;padding:0 4px}.req{color:#a3001b}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.icon-slot svg{vertical-align:middle;margin-left:6px}.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn-sec{background:#ffffff;color:#1d2327;border:1px solid #6b7280}aside.box{margin-top:24px}.dialog{position:fixed;left:50%;top:20%;transform:translateX(-50%);max-width:440px;background:#ffffff;border:2px solid #1d2327;border-radius:10px;padding:16px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}.crumbs{font-size:.9rem;margin:0 0 8px}</style>
</head>
<body>
<main>
<h1>Inscription au tournoi de unihockey</h1>
<p>Le tournoi populaire a lieu le samedi 30 janvier 2027 à la salle de sport. Équipes de 5 joueurs, inscription CHF 50.– par équipe.</p>
<form id="tournoi" novalidate><div class="fld"><label for="equipe">Nom de l&#x27;équipe</label><input id="equipe" name="equipe" type="text" aria-describedby="err-equipe"><p class="err" id="err-equipe"></p></div><div class="fld"><label for="capitaine">Capitaine (nom et prénom)</label><input id="capitaine" name="capitaine" type="text" aria-describedby="err-capitaine"><p class="err" id="err-capitaine"></p></div><div class="row"><div class="fld"><label for="npa">NPA</label><input id="npa" name="npa" type="text" aria-describedby="err-npa" inputmode="numeric" size="6"><p class="err" id="err-npa"></p></div><div class="fld"><label for="courriel">Courriel</label><input id="courriel" name="courriel" type="email" aria-describedby="err-courriel"><p class="err" id="err-courriel"></p></div></div><div class="actions"><button type="submit">Envoyer</button></div></form><div class="okbox" id="merci" tabindex="-1" hidden><p>Merci ! Vos données ont bien été transmises.</p></div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var form = document.getElementById("tournoi");
  var done = document.getElementById("merci");
  var rules = [
    {f:"equipe",t:function(v){return v !== "";},m:"Nom d'équipe manquant",o:"text",x:"err-equipe",mk:1,ln:0},
    {f:"capitaine",t:function(v){return v !== "";},m:"Capitaine manquant",o:"text",x:"err-capitaine",mk:1,ln:0},
    {f:"npa",t:function(v){return /^\d{4}$/.test(v);},m:"NPA : 4 chiffres",o:"text",x:"err-npa",mk:1,ln:0},
    {f:"courriel",t:function(v){return /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v);},m:"Courriel incomplet (@ manquant)",o:"text",x:"err-courriel",mk:1,ln:0}
  ];
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var first = null, items = [];
    done.hidden = true;
    rules.forEach(function (r) {
      var f = document.getElementById(r.f);
      var v = f.value.trim(), ok = r.t(v);
      r.cur = (!ok && r.mf) ? r.mf(v) : r.m;
      var x = r.x ? document.getElementById(r.x) : null;
      if (r.mk) { if (ok) { f.removeAttribute("aria-invalid"); f.classList.remove("is-invalid"); }
                  else { f.setAttribute("aria-invalid", "true"); f.classList.add("is-invalid"); } }
      if (r.o === "text") { x.textContent = ok ? "" : r.cur; if (x.hasAttribute("hidden") || ok) { x.hidden = ok; } }
      if (r.o === "show") { x.hidden = ok; }
      if (!ok) { items.push(r); if (!first) { first = f; } }
    });
    if (first) { first.focus(); return; }
    done.hidden = false; done.focus();
  });
});
</script>
</body>
</html>
