# Klar. CI. GitHub Actions is the only place where the Docker path is
# exercised, so the Docker jobs reproduce it exactly: a clean checkout, no .env, `make ...` from
# track_2b/ with a cold Docker build. No secret is needed by any job.
#
#   unit          pytest + web type-check and build, on the runner
#   e2e-replay    make run (replay) -> /api/health mode, `klar replay-check`, demo report counters;
#                 a .env secret never reaches the app; make eval (non-blocking until labels-v1);
#                 shell-exported LLM_* are honoured (mode local)
#   airgap        make airgap-check: no network route out of the containers, the demo still scans
#   a11y          axe-core on Klar.'s own UI views and on the standalone demo report
#   docker-test   make test (pytest + web type-check inside the Docker test stage)
#   hygiene       generic audit: local paths, co-author lines, placeholders, secrets, big files, artefacts
#   leakage       no prompt / code / demo-site string appears in the test split
#   e2e-arm64     make run on linux/arm64 (Apple Silicon judges); public repositories only
#   make-381      the Makefile under macOS's GNU make 3.81 (dry run)
#
# Actions are pinned to commit SHAs (tag in the comment).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: track_2b
    shell: bash

jobs:
  unit:
    name: "unit: pytest + web type-check/build"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: track_2b/pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: track_2b/src/web/package-lock.json
      - name: Install the package with its dev dependencies
        run: |
          python -m pip install --disable-pip-version-check -e . -r <(python deploy/pyproject_deps.py dev)
          python -m pytest --version || python -m pip install pytest
      - name: Playwright Chromium and its system libraries
        run: python -m playwright install --with-deps chromium
      - name: pytest
        run: python -m pytest -q
      - name: Web install, type-check, build
        working-directory: track_2b/src/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f ../klar/api/static/index.html

  e2e-replay:
    name: "e2e-replay: make run (Docker, replay)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0                  # tags (labels-v1) for make eval

      - name: Tool versions
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          make --version | head -n 1

      - name: Clean checkout has no .env and no LLM variables (judges start in replay mode)
        run: test ! -e .env && test -z "${LLM_BASE_URL:-}"

      - name: Static checks (compose files, shell scripts)
        run: |
          docker compose config --quiet
          docker compose --profile gpu --profile cpu --profile download config --quiet
          docker compose -p klar-airgap -f docker-compose.yml -f deploy/compose.airgap.yml --profile cpu config --quiet
          for f in deploy/*.sh; do sh -n "$f"; done
          docker compose --profile gpu config > "$RUNNER_TEMP/compose-gpu.yml"
          if grep -q -i -E 'tool-call|auto-tool-choice' "$RUNNER_TEMP/compose-gpu.yml"; then
            echo "::error::the vLLM command must not enable tool calling"; exit 1
          fi

      # SEC-4 test, part 1: a .env holding a secret exists BEFORE the app starts. It sets no
      # LLM_* variable, so `make run` below still runs in replay mode.
      - name: Write a .env with a dummy secret and a harmless knob
        run: printf 'HF_TOKEN=hf_dummy_ci_token\nKLAR_ALLOWED_HOSTS=ci.example\n' > .env

      - name: make run (cold build)
        run: make run

      - name: /api/health reports replay mode
        run: |
          curl -fsS http://localhost:8080/api/health | tee health.json
          echo
          python3 -c "import json; h = json.load(open('health.json')); assert h.get('mode') == 'replay', h; print('mode =', h['mode'])"

      - name: klar replay-check (the recorded answers cover the demo)
        run: docker compose exec -T app klar replay-check

      - name: Demo report exists, every answer was recorded, no LLM error
        run: |
          ls -l var/reports/
          python3 - <<'EOF'
          import json
          d = json.load(open("var/reports/demo-latest.json", encoding="utf-8"))
          s = d.get("stats", {})
          print("findings:", len(d.get("findings", [])), "| not_recorded:", s.get("not_recorded"), "| llm_errors:", s.get("llm_errors"))
          assert d.get("mode") == "replay", d.get("mode")
          assert s.get("not_recorded") == 0, f"not_recorded = {s.get('not_recorded')}"
          assert s.get("llm_errors") == 0, f"llm_errors = {s.get('llm_errors')}"
          EOF
          test -s var/reports/demo-latest.html

      # SEC-4 test, part 2: the running app never received the secret from .env. The positive
      # controls prove that .env WAS read: by the app (KLAR_ALLOWED_HOSTS) and for the model
      # server (HF_TOKEN in the rendered llm-gpu service).
      - name: Secrets stay out of the app container (HF_TOKEN reaches only the model server)
        run: |
          docker compose exec -T app env > "$RUNNER_TEMP/app-env.txt"
          docker compose --profile gpu config > "$RUNNER_TEMP/compose-gpu.yml"
          sed -n '/^  llm-gpu:/,/^  [a-z-]*:$/p' "$RUNNER_TEMP/compose-gpu.yml" > "$RUNNER_TEMP/llm-gpu.yml"
          if grep -q -E '^HF_TOKEN=|hf_dummy_ci_token' "$RUNNER_TEMP/app-env.txt"; then
            echo "::error::HF_TOKEN reached the app container"; exit 1
          fi
          if ! grep -q '^KLAR_ALLOWED_HOSTS=ci.example$' "$RUNNER_TEMP/app-env.txt"; then
            echo "::error::positive control failed: the app did not receive KLAR_ALLOWED_HOSTS from .env"; exit 1
          fi
          if ! grep -q 'HF_TOKEN: hf_dummy_ci_token' "$RUNNER_TEMP/llm-gpu.yml"; then
            echo "::error::positive control failed: llm-gpu did not receive HF_TOKEN from .env"; exit 1
          fi
          echo "OK: HF_TOKEN only in llm-gpu; the app got KLAR_ALLOWED_HOSTS from .env"
          rm -f .env

      # Non-blocking for now: `klar eval --split test` refuses to run until the git tag labels-v1
      # exists. This step becomes blocking (remove continue-on-error) once labels-v1 exists.
      - name: make eval (replay; non-blocking until labels-v1 exists)
        continue-on-error: true
        run: make eval BUILD=0

      - name: Shell-exported LLM_* are honoured without a .env (mode local)
        env:
          LLM_BASE_URL: http://host.docker.internal:9/v1
          LLM_NAME: ci-model
          LLM_API_KEY: ci-key
        run: |
          test ! -e .env
          make stop
          make run BUILD=0 DEMO=0
          curl -fsS http://localhost:8080/api/health | tee health-local.json
          echo
          python3 -c "import json; h = json.load(open('health-local.json')); assert h.get('mode') == 'local', h; assert h.get('base_url_host') == 'host.docker.internal', h"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=300 || true

      - name: Upload the demo report, health and eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: klar-demo-report
          path: |
            track_2b/var/reports/
            track_2b/health*.json
            track_2b/eval/results/
          if-no-files-found: warn
          retention-days: 14

      - name: make stop
        if: always()
        run: make stop

  airgap:
    name: "airgap: make airgap-check (no network route out)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make airgap-check
        run: make airgap-check

  a11y:
    name: "a11y: axe-core on Klar.'s own pages"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make run
        run: make run
      - name: axe (UI views light/dark, EN/DE; standalone demo report)
        run: docker compose exec -T app python3 - < deploy/a11y_check.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200 || true
      - name: make stop
        if: always()
        run: make stop

  docker-test:
    name: "docker-test: make test (Docker test stage)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make test
        run: make test

  hygiene:
    name: "hygiene: tracked files"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0                  # all commit messages (co-author check)
      - name: Repository hygiene audit
        run: sh deploy/hygiene.sh

  leakage:
    name: "leakage: test split vs prompts, code lists and demo site"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: scripts/check_leakage.py
        run: |
          test -f scripts/check_leakage.py || { echo "::error::scripts/check_leakage.py is missing"; exit 1; }
          python -I scripts/check_leakage.py

  e2e-arm64:
    name: "e2e-arm64: make run on linux/arm64 (Apple Silicon)"
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make run (cold build)
        run: make run
      - name: /api/health reports replay mode; demo report with no unrecorded answer, no LLM error
        run: |
          curl -fsS http://localhost:8080/api/health | tee health.json
          echo
          python3 -c "import json; h = json.load(open('health.json')); assert h.get('mode') == 'replay', h"
          python3 -c "import json; s = json.load(open('var/reports/demo-latest.json', encoding='utf-8')).get('stats', {}); print(s.get('not_recorded'), s.get('llm_errors')); assert s.get('not_recorded') == 0 and s.get('llm_errors') == 0, s"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=300 || true
      - name: make stop
        if: always()
        run: make stop

  make-381:
    name: "make-381: the Makefile under macOS GNU make 3.81 (dry run)"
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make -n with /usr/bin/make (3.81)
        run: |
          /usr/bin/make --version | head -n 1
          /usr/bin/make -n run run-gpu run-cpu eval test airgap-check bundle download-model stop logs clean help > /dev/null
          /usr/bin/make -n run | grep -F 'deploy/endpoint.sh run "1" ""'
          LLM_BASE_URL=http://h.example:9/v1 /usr/bin/make -n run | grep -F 'deploy/endpoint.sh run "0" "http://h.example:9/v1"'
          /usr/bin/make -n run-gpu | grep -F '"http://llm-gpu:8000/v1"'
